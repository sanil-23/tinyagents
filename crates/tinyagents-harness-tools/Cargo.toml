[package]
name = "tinyagents-harness-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Default harness tool implementations for TinyAgents."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.10.0", default-features = false }
tinyagents-tasks = { path = "../tinyagents-tasks", version = "2.10.0", default-features = false, optional = true }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1", optional = true }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.6.0" }
tinyagents-orchestration = { path = "../tinyagents-orchestration", version = "2.10.0", default-features = false, optional = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tracing = { workspace = true }

[features]
default = ["todos", "goals", "skills"]
todos = []
goals = []
skills = []
state-block = ["goals", "todos", "dep:tinyinference-llm"]
subagents = ["dep:tinyagents-orchestration", "dep:tinyagents-tasks", "dep:tinyinference-llm"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[dev-dependencies.tokio]
workspace = true
features = ["test-util"]

[[example]]
name = "goals_and_todos"
path = "examples/goals_and_todos.rs"
required-features = ["goals", "todos"]
